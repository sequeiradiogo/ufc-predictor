name: Weekly Predictions

on:
  schedule:
    - cron: '0 12 * * 5'  # Every Friday at 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    # Data lives in the private Cloudflare R2 bucket, versioned with DVC (issue #70).
    # The DVC S3 remote reads the standard AWS variables; the token is scoped to that
    # bucket only (Object Read & Write).
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "dvc[s3]==3.67.1"
          playwright install chromium --with-deps

      - name: Pull DBs, rankings and prod models from R2
        run: dvc pull db/ufc_ufcstats.db db/ufc_v2.db raw_data/rankings_history.csv models_v1_prod

      - name: Refresh live rankings snapshot
        id: refresh_rankings
        continue-on-error: true
        run: python scrapers/ufc_rankings_web.py

      # rankings_history.csv can't be rebuilt (the scraper only sees today's
      # rankings), so the new version goes to R2 before anything is committed:
      # the .dvc file committed below must never point at data R2 doesn't have.
      # Transition (issue #70): also mirrored to the old public release until the
      # DVC path has run for two monthly refreshes.
      - name: Version updated rankings (R2 + release mirror)
        if: steps.refresh_rankings.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dvc add raw_data/rankings_history.csv
          dvc push raw_data/rankings_history.csv
          gh release upload data-artifacts-latest raw_data/rankings_history.csv --clobber

      # predict.py silently computes garbage splm/sapm from a broken DB
      # (UFC 329 shipped that way) -- refuse to predict instead.
      - name: Check DB health
        run: python scripts/check_db_health.py

      - name: Run event predictions
        run: python scripts/predict_event.py --model ensemble --skip-existing

      - name: Commit predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions/ raw_data/rankings_history.csv.dvc
          if git diff --cached --quiet; then
            echo "No new predictions or rankings to commit."
          else
            git commit -m "chore: add event predictions and rankings snapshot [skip ci]"
            git push
          fi
