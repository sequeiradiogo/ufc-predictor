name: Monthly Data Refresh

on:
  schedule:
    - cron: '0 6 1 * *'  # 1st of every month at 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview scrape, no writes)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Download DB and rankings artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download data-artifacts-latest --dir db/ --pattern "*.db"
          gh release download data-artifacts-latest --dir raw_data/ --pattern "rankings_history.csv"

      - name: Refresh data
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/refresh_data.py --auto --dry-run
          else
            python scripts/refresh_data.py --auto
          fi

      # refresh_data.py only inserts raw per-fight rows; the pre-fight rolling
      # columns (splm, sapm, head_acc, cumulative total_fight_time, ...) that
      # the CSV enrichment and predict.py read come from rolling.py. Skipping
      # it left every fight from Jul 2026 on with NULL rolling stats.
      # refresh_data.py doesn't write fight_stats_rounds either; the round-1
      # EWMA features read it. Only fights missing round rows are scraped.
      - name: Rebuild rolling stats and round stats
        if: ${{ inputs.dry_run != true }}
        run: |
          python scripts/backfill_rounds.py
          python -c "from db.rolling import main; from config import DB_UFCSTATS_PATH; main(db_path=DB_UFCSTATS_PATH)"
          python scripts/check_db_health.py

      # Pre-UFC careers (ml/pre_ufc.py features): refresh the ESPN <-> UFCStats map from
      # the UFC events, then fetch only the new fighters' non-UFC bouts and their
      # opponents' histories (incremental, a few minutes). An ESPN outage leaves the
      # tracked CSVs as they were -- the features are then a month stale, not broken,
      # and training and live inference still read the same files.
      - name: Refresh ESPN pre-UFC data
        if: ${{ inputs.dry_run != true }}
        continue-on-error: true
        run: |
          python scripts/scrape_espn.py
          python scripts/scrape_espn_careers.py
          python scripts/scrape_espn_careers.py --opponents

      - name: Enrich v1 CSV
        if: ${{ inputs.dry_run != true }}
        run: |
          python scripts/add_defensive_stats_to_csv.py
          python scripts/add_rankings_to_csv.py
          python scripts/rebuild_career_stats.py
          python scripts/add_computed_features_to_csv.py

      - name: Rebuild mdabbert DB and v1 feature CSV
        if: ${{ inputs.dry_run != true }}
        run: |
          python db/ingest_mdabbert.py --csv raw_data/ufc-master.csv --db db/ufc_v2.db
          python ml/ML_data_preparation_v1.py

      - name: Retrain v1 models
        if: ${{ inputs.dry_run != true }}
        run: |
          python ml/train_v1_models.py
          python ml/train_v1_models.py --prod
          python ml/finish_type_model.py
          python ml/finish_type_model.py --prod

      # Replays predict.py on the last events and compares every win-model
      # feature with its training value -- fails (before anything is committed
      # or uploaded) if live inference no longer builds what was trained on.
      - name: Check live-inference feature parity
        if: ${{ inputs.dry_run != true }}
        run: python scripts/check_live_parity.py --events 4 --min-match 0.9

      - name: Commit updated artifacts
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add raw_data/ufc-master.csv raw_data/espn_dwcs_fights.csv raw_data/espn_fighter_map.csv raw_data/espn_career_fights.csv raw_data/espn_opponent_bouts.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: monthly data refresh [skip ci]"
            git push
          fi

      - name: Upload updated DB and model artifacts to release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czf models_v1.tar.gz models_v1/*.joblib
          tar -czf models_v1_prod.tar.gz models_v1_prod/*.joblib
          gh release upload data-artifacts-latest \
            db/ufc_ufcstats.db \
            db/ufc_v2.db \
            raw_data/rankings_history.csv \
            models_v1.tar.gz \
            models_v1_prod.tar.gz \
            --clobber
