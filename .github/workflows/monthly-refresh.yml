name: Monthly Data Refresh

on:
  schedule:
    - cron: '0 6 1 * *'  # 1st of every month at 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview scrape, no writes)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Data lives in the private Cloudflare R2 bucket, versioned with DVC (issue #70).
    # The DVC S3 remote reads the standard AWS variables; the token is scoped to that
    # bucket only (Object Read & Write).
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "dvc[s3]==3.67.1"
          playwright install chromium --with-deps

      # The models are not pulled: they are retrained below. Neither is the ESPN
      # response cache (raw_data/espn_cache.tar.gz): it caches athlete eventlogs
      # forever, so with it the incremental ESPN scrape would miss new bouts.
      - name: Pull DBs and rankings from R2
        run: dvc pull db/ufc_ufcstats.db db/ufc_v2.db raw_data/rankings_history.csv

      - name: Refresh data
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/refresh_data.py --auto --dry-run
          else
            python scripts/refresh_data.py --auto
          fi

      # refresh_data.py only inserts raw per-fight rows; the pre-fight rolling
      # columns (splm, sapm, head_acc, cumulative total_fight_time, ...) that
      # the CSV enrichment and predict.py read come from rolling.py. Skipping
      # it left every fight from Jul 2026 on with NULL rolling stats.
      # refresh_data.py doesn't write fight_stats_rounds either; the round-1
      # EWMA features read it. Only fights missing round rows are scraped.
      # backfill_reversals.py is a safety net: refresh_data.py dropped reversals
      # until 2026-11 (Jul-Nov 2026 were NULL); it only visits NULL fights.
      - name: Rebuild rolling stats and round stats
        if: ${{ inputs.dry_run != true }}
        run: |
          python scripts/backfill_rounds.py
          python scripts/backfill_reversals.py
          python -c "from db.rolling import main; from config import DB_UFCSTATS_PATH; main(db_path=DB_UFCSTATS_PATH)"
          python scripts/check_db_health.py

      # Pre-UFC careers (ml/pre_ufc.py features): refresh the ESPN <-> UFCStats map from
      # the UFC events, then fetch only the new fighters' non-UFC bouts and their
      # opponents' histories (incremental, a few minutes). An ESPN outage leaves the
      # tracked CSVs as they were -- the features are then a month stale, not broken,
      # and training and live inference still read the same files.
      - name: Refresh ESPN pre-UFC data
        if: ${{ inputs.dry_run != true }}
        continue-on-error: true
        run: |
          python scripts/scrape_espn.py
          python scripts/scrape_espn_careers.py
          python scripts/scrape_espn_careers.py --opponents

      - name: Enrich v1 CSV
        if: ${{ inputs.dry_run != true }}
        run: |
          python scripts/add_defensive_stats_to_csv.py
          python scripts/add_rankings_to_csv.py
          python scripts/rebuild_career_stats.py
          python scripts/add_computed_features_to_csv.py

      - name: Rebuild mdabbert DB and v1 feature CSV
        if: ${{ inputs.dry_run != true }}
        run: |
          python db/ingest_mdabbert.py --csv raw_data/ufc-master.csv --db db/ufc_v2.db
          python ml/ML_data_preparation_v1.py

      - name: Retrain v1 models
        if: ${{ inputs.dry_run != true }}
        run: |
          python ml/train_v1_models.py
          python ml/train_v1_models.py --prod
          python ml/finish_type_model.py
          python ml/finish_type_model.py --prod

      # Replays the retrain on data up to 3 months ago (temp dir, live tiers
      # untouched) and scores the trial prod ensemble on the held-out fights
      # against the closing line (issue #67) -- fails before anything is
      # committed or uploaded if the retrain is clearly broken. Report in the
      # job summary and shipped in models_v1_prod.tar.gz.
      # It also shadow-scores the V2 prod design on the same fights (issue #76,
      # never gates) and appends the new ones to the tracked history CSV.
      - name: Validate prod retrain out of sample
        if: ${{ inputs.dry_run != true }}
        run: python scripts/validate_prod_retrain.py --report models_v1_prod/prod_validation.json --shadow-history analytics/reports/prod_v2_shadow.csv

      # Replays predict.py on the last events and compares every win-model
      # feature with its training value -- fails (before anything is committed
      # or uploaded) if live inference no longer builds what was trained on.
      - name: Check live-inference feature parity
        if: ${{ inputs.dry_run != true }}
        run: python scripts/check_live_parity.py --events 4 --min-match 0.9

      # New data versions go to R2 *before* the commit: a pushed .dvc file must
      # never point at data the bucket doesn't have. Unchanged files keep their
      # hash and are not uploaded again.
      - name: Version DBs, rankings and models with DVC (push to R2)
        if: ${{ inputs.dry_run != true }}
        run: |
          dvc add db/ufc_ufcstats.db db/ufc_v2.db raw_data/rankings_history.csv models_v1 models_v1_prod
          dvc push db/ufc_ufcstats.db db/ufc_v2.db raw_data/rankings_history.csv models_v1 models_v1_prod

      - name: Commit updated artifacts
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add raw_data/ufc-master.csv raw_data/espn_dwcs_fights.csv raw_data/espn_fighter_map.csv raw_data/espn_career_fights.csv raw_data/espn_opponent_bouts.csv analytics/reports/prod_v2_shadow.csv
          git add db/ufc_ufcstats.db.dvc db/ufc_v2.db.dvc raw_data/rankings_history.csv.dvc models_v1.dvc models_v1_prod.dvc
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: monthly data refresh [skip ci]"
            git push
          fi

      # Transition (issue #70): R2 + DVC is the source of truth; the two release
      # steps below mirror it to the old public releases until the DVC path has
      # run for two monthly refreshes, then they are removed.
      - name: Upload updated DB and model artifacts to release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czf models_v1.tar.gz models_v1/*.joblib
          tar -czf models_v1_prod.tar.gz models_v1_prod/*.joblib models_v1_prod/prod_validation.json
          gh release upload data-artifacts-latest \
            db/ufc_ufcstats.db \
            db/ufc_v2.db \
            raw_data/rankings_history.csv \
            models_v1.tar.gz \
            models_v1_prod.tar.gz \
            --clobber

      # The step above overwrites data-artifacts-latest, so this keeps an immutable
      # dated copy of everything a refresh produces (issue #70): restoring an earlier
      # state = `gh release download data-YYYY-MM-DD`. rankings_history.csv matters
      # most -- the scraper only sees today's rankings, so its history exists nowhere
      # else. A re-run on the same day replaces that day's snapshot; --latest=false
      # keeps data-artifacts-latest as the release marked Latest.
      - name: Create dated data snapshot release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="data-$(date -u +%Y-%m-%d)"
          SHA="$(git rev-parse HEAD)"
          FILES="db/ufc_ufcstats.db db/ufc_v2.db raw_data/rankings_history.csv \
            models_v1.tar.gz models_v1_prod.tar.gz raw_data/ufc-master.csv \
            raw_data/espn_dwcs_fights.csv raw_data/espn_fighter_map.csv \
            raw_data/espn_career_fights.csv raw_data/espn_opponent_bouts.csv"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$SHA" --latest=false \
              --title "Data snapshot $TAG" \
              --notes "Produced by monthly-refresh.yml run ${{ github.run_id }} at commit $SHA. Restore with: gh release download $TAG"
          fi
